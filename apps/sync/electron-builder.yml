appId: com.mandor.sync
productName: Mandor Request
executableName: mandor-request
artifactName: Mandor-Request-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false

# Each app follows a fixed release of its own: the `github` provider reads the latest release of
# the whole repository, which the two apps share, and skips every tag that is not a bare version.
publish:
    provider: generic
    url: https://github.com/joalvm/mandor/releases/download/sync-feed
# A stable writes the beta files too, so an install on the beta moves to it once it is newer.
generateUpdatesFilesForAllChannels: true

directories:
    buildResources: resources
    output: dist

files:
    - out/**
    - package.json
    - resources/icon.png
    - '!out/**/*.map'

extraResources:
    - from: ../../LICENSE
      to: licenses/LICENSE
    - from: ../../packages/icons/NOTICE.md
      to: licenses/icons-NOTICE.md
    - from: ../../packages/icons/licenses
      to: licenses/icons

electronFuses:
    runAsNode: false
    enableCookieEncryption: true
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    enableEmbeddedAsarIntegrityValidation: true
    onlyLoadAppFromAsar: true
    loadBrowserProcessSpecificV8Snapshot: false
    grantFileProtocolExtraPrivileges: false

win:
    icon: resources/icon.ico
    target:
        - target: nsis
          arch:
              - x64
              - arm64

nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: false
    installerIcon: resources/icon.ico
    uninstallerIcon: resources/icon.ico

mac:
    icon: resources/icon.png
    category: public.app-category.developer-tools
    # Ad-hoc until there is a Developer ID. Unsigned, a download on Apple silicon says the app is
    # damaged and only a terminal opens it; ad-hoc, macOS lets the person allow it in its settings.
    # The hardened runtime is for notarizing, and with an ad-hoc signature it fails the library
    # validation of the framework at launch.
    identity: '-'
    hardenedRuntime: false
    target:
        - target: dmg
          arch:
              - x64
              - arm64
        # The updater reads `latest-mac.yml`, which electron-builder writes only beside a zip.
        - target: zip
          arch:
              - x64
              - arm64

linux:
    icon: resources/icon.png
    category: Development
    maintainer: Alejandro Vilchez <joalvm@gmail.com>
    syncDesktopName: true
    target:
        - target: AppImage
          arch:
              - x64
              - arm64
        - target: deb
          arch:
              - x64
              - arm64
