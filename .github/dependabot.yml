# Dependencies and workflow actions are checked once a week. Every pull request Dependabot opens
# runs the same checks as any other change into main.
version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/Lima
      open-pull-requests-limit: 5
      # A release younger than three days is not proposed: the worst supply-chain cases are
      # found and pulled in that window. Security updates ignore the delay.
      cooldown:
          default-days: 3
      # The titles follow the repository's own rule: type(scope): description.
      commit-message:
          prefix: 'build(deps)'
          prefix-development: 'build(deps-dev)'
      groups:
          minor-and-patch:
              update-types: [minor, patch]
      # TypeScript 7 is the native compiler and ships no compiler API: typescript-eslint (peer
      # below 6.1), knip and dependency-cruiser read the program through it. Lift this once
      # typescript-eslint accepts 7.
      ignore:
          - dependency-name: typescript
            versions: ['>=7']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/Lima
      open-pull-requests-limit: 3
      cooldown:
          default-days: 3
      commit-message:
          prefix: 'build(actions)'
      groups:
          actions:
              patterns: ['*']
