asyncapi: 2.6.0
info:
    title: Pasarela
    version: '1.0.0'
    description: Recibe pedidos y devuelve recibos.
servers:
    produccion:
        url: wss://pasarela.ejemplo.com:443/v1
        protocol: wss
        security:
            - token-portador: []
        bindings:
            ws:
                bindingVersion: 0.1.0
                query:
                    token: '{{token}}'
x-zona: eu-oeste
channels:
    pedidos/entrantes:
        description: Pedidos que entran a la pasarela
        publish:
            operationId: registrarPedido
            message:
                name: pedido
                payload:
                    type: object
                    properties:
                        id:
                            type: string
    recibos/salientes:
        subscribe:
            operationId: recibirRecibo
            message:
                $ref: '#/components/messages/reciboEmitido'
    avisos/salientes:
        subscribe:
            operationId: notificarRecibo
            message:
                $ref: '#/components/messages/reciboEmitido'
components:
    messages:
        reciboEmitido:
            payload:
                type: object
                properties:
                    id:
                        type: string
                    total:
                        type: number
            examples:
                - payload:
                      id: '1234'
                      total: 42.5
    securitySchemes:
        token-portador:
            type: http
            scheme: bearer
            bearerFormat: jwt
