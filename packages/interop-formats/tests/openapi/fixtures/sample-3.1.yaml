openapi: 3.1.0
info:
    title: Sample Shop
    version: 2.0.0
    summary: A shop
servers:
    - url: https://{env}.shop.example.com/api
      description: Shop
      variables:
          env:
              default: prod
              enum: [prod, staging]
    - url: /relative
tags:
    - name: orders
    - name: files
security:
    - basicAuth: []
paths:
    /orders:
        description: Orders collection
        get:
            tags: [orders]
            summary: List orders
            parameters:
                - name: status
                  in: query
                  required: true
                  schema: { type: string, default: open }
                - name: page
                  in: query
                  schema: { type: integer }
                  example: 2
                - name: session
                  in: cookie
                  schema: { type: string, default: abc }
            responses:
                '200':
                    description: ok
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Order'
                            examples:
                                one:
                                    value: [{ id: 1 }]
        post:
            tags: [orders]
            operationId: createOrder
            deprecated: true
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: '#/components/schemas/Order'
                                - type: object
                                  properties:
                                      note: { type: string }
            responses:
                '201': { description: created }
    /orders/{orderId}:
        parameters:
            - name: orderId
              in: path
              required: true
              schema: { type: string }
        get:
            tags: [orders]
            summary: Get an order
            security: []
            responses:
                '200':
                    description: ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
    /files:
        post:
            tags: [files]
            summary: Upload a file
            security:
                - apiKeyAuth: []
            requestBody:
                content:
                    application/octet-stream:
                        schema: { type: string, format: binary }
            responses:
                '204': { description: stored }
webhooks:
    orderPaid:
        post:
            requestBody:
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/Order' }
            responses:
                '200': { description: ok }
components:
    schemas:
        Order:
            type: object
            allOf:
                - properties:
                      id: { type: integer }
                - properties:
                      total: { type: number }
        Node:
            type: object
            properties:
                child:
                    $ref: '#/components/schemas/Node'
    securitySchemes:
        basicAuth:
            type: http
            scheme: basic
        apiKeyAuth:
            type: apiKey
            in: header
            name: X-Api-Key
x-internal: true
