info:
    name: Subir foto
    type: http
    seq: 3
http:
    method: POST
    url: '{{baseUrl}}/pets/:id/photo'
    params:
        - name: id
          value: '7'
          type: path
    body:
        type: multipart-form
        data:
            - name: caption
              type: text
              value: Rex
            - name: photo
              type: file
              value:
                  - ./fotos/rex.png
